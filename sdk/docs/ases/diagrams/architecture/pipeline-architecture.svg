  <text x="390.0" y="237.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Adapter</text>
  <text x="390.0" y="255.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Sees an Event.</text><text x="390.0" y="268.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Emits EVENT / OBSERVATION_COMPLETED only.</text>
</g><path d="M 390.0 278 L 390.0 318" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#arrowD)"/>
<g>
  <rect x="83.0" y="321" width="620" height="78" rx="10" fill="#000" opacity="0.12"/>
  <rect x="80.0" y="318" width="620" height="78" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="390.0" y="355.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Event Pipeline</text>
  <text x="390.0" y="373.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Framework-agnostic router.</text><text x="390.0" y="386.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Orchestrator — not a Builder.</text>
</g><path d="M 390.0 396 L 390.0 436" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#arrowD)"/>
<g>
  <rect x="83.0" y="439" width="620" height="78" rx="10" fill="#000" opacity="0.12"/>
  <rect x="80.0" y="436" width="620" height="78" rx="10" fill="#166534" stroke="#22c55e" stroke-width="2.2"/>
  <text x="390.0" y="473.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Observation Collector</text>
  <text x="390.0" y="491.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Gathers Events. Owns the Lifecycle.</text><text x="390.0" y="504.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Decides when an Observation is complete.</text>
</g><path d="M 390.0 514 L 390.0 554" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#arrowD)"/>
<g>
  <rect x="83.0" y="557" width="620" height="78" rx="10" fill="#000" opacity="0.12"/>
  <rect x="80.0" y="554" width="620" height="78" rx="10" fill="#581c87" stroke="#a855f7" stroke-width="2.2"/>
  <text x="390.0" y="591.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Observation Builder</text>
  <text x="390.0" y="609.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Converts Events into ASES JSON.</text><text x="390.0" y="622.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Stateless. Knows the Schema.</text>
</g><path d="M 390.0 632 L 390.0 672" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#arrowD)"/>
<g>
  <rect x="83.0" y="675" width="620" height="78" rx="10" fill="#000" opacity="0.12"/>
  <rect x="80.0" y="672" width="620" height="78" rx="10" fill="#78350f" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="390.0" y="709.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Observation Validator</text>
  <text x="390.0" y="727.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Confirms Schema compliance.</text><text x="390.0" y="740.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Rejects malformed Observations.</text>
</g><path d="M 390.0 750 L 390.0 790" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#arrowD)"/>
<g>
  <rect x="83.0" y="793" width="620" height="78" rx="10" fill="#000" opacity="0.12"/>
  <rect x="80.0" y="790" width="620" height="78" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.2"/>
  <text x="390.0" y="827.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Transport</text>
  <text x="390.0" y="845.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Queue → Worker → Serializer → API Client.</text><text x="390.0" y="858.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">Async. Passive. Never blocks the Agent.</text>
</g><path d="M 390.0 868 L 390.0 908" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#arrowD)"/>
<g>
