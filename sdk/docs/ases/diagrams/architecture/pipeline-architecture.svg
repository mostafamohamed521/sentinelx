  <text x="390.0" y="938.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">SentinelX REST API</text>
  <text x="390.0" y="956.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">SDK responsibility ends at 202 Accepted.</text>
</g></svg>