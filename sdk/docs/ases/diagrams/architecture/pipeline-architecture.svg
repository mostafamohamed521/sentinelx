  <text x="390.0" y="128.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Framework</text>
  <text x="390.0" y="146.0" text-anchor="middle" font-size="9.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif">CrewAI · LangGraph · Custom Agent</text>
</g><path d="M 390.0 160 L 390.0 200" stroke="#475569" stroke-width="2.2" fill="none" marker-end="url(#arrowD)"/>
<g>
  <rect x="83.0" y="203" width="620" height="78" rx="10" fill="#000" opacity="0.12"/>
