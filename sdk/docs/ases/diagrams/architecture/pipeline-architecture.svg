<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1032" width="780" height="1032"><rect x="0" y="0" width="780" height="1032" fill="#f1f5f9"/>
<text x="390.0" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">ASES Integration Layer — Processing Pipeline</text>
<text x="390.0" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Every framework converges on the same pipeline — only the Adapter changes</text>
