    <!--
      Type system: Inter for body copy (already the app's baseline),
      Space Grotesk as the display face for page titles and headline
      numbers (a geometric, technical character fitting a security
      operations tool without tipping into decorative), and JetBrains
      Mono for anything that reads as data — timestamps, IDs, metrics —
      the SOC-console cue that distinguishes measured facts from prose.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"

    />
