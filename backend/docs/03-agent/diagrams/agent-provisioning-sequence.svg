<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#166534"/>
  </marker>
</defs>
<rect x="0" y="0" width="1000" height="700" fill="#f8fafc"/>
<text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">SentinelX — Agent Provisioning Sequence (Sprint 2)</text>
<text x="500" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Two sequential backend calls, orchestrated by the client — never merged server-side (ADR-001)</text>

<!-- Lifelines -->
<!-- Human -->
<rect x="40" y="80" width="150" height="34" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
<text x="115" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Human (Dashboard)</text>
<line x1="115" y1="114" x2="115" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Agent Module -->
<rect x="280" y="80" width="170" height="34" rx="6" fill="#ecfdf5" stroke="#166534" stroke-width="1.4"/>
<text x="365" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#166534">Agent Module</text>
<line x1="365" y1="114" x2="365" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Auth API Key submodule -->
<rect x="560" y="80" width="220" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="670" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">Authentication (API Key)</text>
<line x1="670" y1="114" x2="670" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Database -->
<rect x="860" y="80" width="110" height="34" rx="6" fill="#fdf4ff" stroke="#7e22ce" stroke-width="1.4"/>
<text x="915" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7e22ce">Database</text>
<line x1="915" y1="114" x2="915" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Step 1: POST /agents -->
<path d="M 115 150 L 365 150" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="240" y="142" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155">1. POST /agents { name, framework }</text>

<path d="M 365 180 L 915 180" stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<text x="640" y="172" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#334155">INSERT INTO agents (status=ACTIVE)</text>

<path d="M 915 205 L 365 205" stroke="#166534" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>

<path d="M 365 232 L 115 232" stroke="#166534" stroke-width="1.6" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>
<text x="240" y="224" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#166534">201 Created — Agent (no key)</text>

<!-- divider -->
<line x1="60" y1="270" x2="960" y2="270" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,3"/>
<text x="500" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">Dashboard immediately chains the next call — invisible to the operator</text>

<!-- Step 2: POST rotate-api-key -->
<path d="M 115 320 L 670 320" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="390" y="312" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155">2. POST /agents/{id}/rotate-api-key</text>

<path d="M 670 350 L 365 350" stroke="#1d4ed8" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="342" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#1d4ed8">AgentLookupContract.findActiveAgentForOrganization()</text>

<path d="M 365 375 L 670 375" stroke="#166534" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>
<text x="500" y="392" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#166534">Agent { id, status: ACTIVE }</text>

<path d="M 670 415 L 915 415" stroke="#1d4ed8" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<text x="790" y="407" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1d4ed8">INSERT INTO api_keys (key_hash, status=ACTIVE)</text>

<path d="M 915 440 L 670 440" stroke="#166534" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>

<path d="M 670 468 L 115 468" stroke="#166534" stroke-width="1.6" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>
<text x="390" y="460" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#166534">201 Created — { key_prefix, raw_key } (shown once)</text>

<!-- Final note -->
<rect x="180" y="530" width="640" height="110" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="500" y="555" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Module Boundary Note</text>
<text x="500" y="576" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">Agent Module never calls Authentication — it is called BY it,</text>
<text x="500" y="594" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">via the read-only AgentLookupContract only.</text>
<text x="500" y="612" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">See 04-api-key-coordination.md and ADR-001.</text>

<text x="500" y="680" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Human copies raw_key into the SDK's configuration — never retrievable again</text>
</svg>
