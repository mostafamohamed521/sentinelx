<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
  </marker>
</defs>
<rect x="0" y="0" width="900" height="420" fill="#f8fafc"/>
<text x="450" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">SentinelX — Agent Status State Machine</text>
<text x="450" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748b">agents.status — two states, one directed edge, no reverse transition in V1</text>

<!-- Create entry point -->
<circle cx="450" cy="110" r="6" fill="#0f172a"/>
<path d="M 450 116 L 450 150" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="470" y="135" font-family="Consolas, Menlo, monospace" font-size="12" fill="#334155">create</text>

<!-- ACTIVE box -->
<rect x="330" y="150" width="240" height="90" rx="10" fill="#ecfdf5" stroke="#166534" stroke-width="2"/>
<text x="450" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#166534">ACTIVE</text>
<text x="450" y="210" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#166534">can submit Observations</text>
<text x="450" y="226" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#166534">has a usable API Key</text>

<!-- Arrow ACTIVE -> ARCHIVED -->
<path d="M 570 210 L 720 210 L 720 280" stroke="#b91c1c" stroke-width="1.8" fill="none" marker-end="url(#arrowRed)"/>
<rect x="595" y="196" width="140" height="20" fill="#ffffff" stroke="#b91c1c" stroke-width="0.8" rx="3"/>
<text x="665" y="210" text-anchor="middle" font-size="11" fill="#b91c1c" font-family="Consolas, Menlo, monospace" font-weight="700">PATCH .../archive</text>

<!-- ARCHIVED box -->
<rect x="330" y="290" width="240" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="450" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#b91c1c">ARCHIVED</text>
<text x="450" y="350" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#b91c1c">API Key auto-revoked</text>
<text x="450" y="366" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#b91c1c">terminal — no V1 reverse edge</text>

<path d="M 720 280 L 570 210" stroke="none"/>

<!-- self-loop on ARCHIVED for idempotency -->
<path d="M 330 335 C 250 335 250 380 330 365" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
<text x="150" y="358" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#64748b">archive again</text>
<text x="150" y="372" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#64748b">→ 409 CONFLICT</text>

<!-- Legend -->
<rect x="620" y="330" width="220" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="635" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700">Legend</text>
<line x1="635" y1="362" x2="660" y2="362" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="668" y="366" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155">allowed transition</text>
<line x1="635" y1="382" x2="660" y2="382" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="668" y="386" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155">rejected / idempotent</text>
</svg>
