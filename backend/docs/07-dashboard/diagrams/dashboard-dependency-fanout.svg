<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
  </marker>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="#f8fafc"/>
<text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">SentinelX — Dashboard Dependency Fan-Out</text>
<text x="500" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">The first module allowed to depend on all four at once. None of the four ever depend back.</text>

<!-- Dashboard box -->
<rect x="400" y="90" width="200" height="70" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.4"/>
<text x="500" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#6d28d9">Dashboard</text>
<text x="500" y="142" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#6d28d9">owns no data — Read Layer</text>

<!-- Four target modules -->
<rect x="60" y="280" width="180" height="80" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="150" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#c2410c">Agent</text>
<text x="150" y="335" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#c2410c">AgentSummaryContract</text>

<rect x="290" y="280" width="180" height="80" rx="10" fill="#ecfdf5" stroke="#166534" stroke-width="2"/>
<text x="380" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#166534">Observation</text>
<text x="380" y="335" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#166534">ObservationSummaryContract</text>

<rect x="520" y="280" width="180" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="610" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#1d4ed8">Analysis</text>
<text x="610" y="335" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1d4ed8">PredictionStatsContract</text>

<rect x="750" y="280" width="190" height="80" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="845" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">Alert</text>
<text x="845" y="335" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#b91c1c">AlertSummaryContract (extended)</text>

<!-- arrows from Dashboard fanning down -->
<path d="M 460 160 L 160 280" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M 490 160 L 385 280" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M 510 160 L 605 280" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M 540 160 L 840 280" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

<!-- chain below showing the existing dependency chain among the four -->
<text x="500" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">These four still form their own existing chain (unchanged since Stages 2-5):</text>
<path d="M 240 320 L 290 320" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)" stroke-dasharray="3,2"/>
<path d="M 470 320 L 520 320" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)" stroke-dasharray="3,2"/>
<path d="M 700 320 L 750 320" stroke="#94a3b8" stroke-width="1.3" fill="none" marker-end="url(#arrow)" stroke-dasharray="3,2"/>
<text x="500" y="425" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#64748b">Observation → Agent, Analysis → Observation, Alert → Analysis (all pre-existing)</text>

<!-- boundary note -->
<rect x="150" y="450" width="700" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="500" y="475" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Module Boundary Note</text>
<text x="500" y="496" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">Every arrow above points AWAY from Dashboard. None of the four modules import</text>
<text x="500" y="514" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">anything from Dashboard, call it, or know it exists. See 01-overview.md §5.</text>
</svg>
