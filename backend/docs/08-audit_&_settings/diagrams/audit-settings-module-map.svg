<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
<rect x="0" y="0" width="1000" height="520" fill="#f8fafc"/>
<text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">SentinelX — Stage 7: Three Modules, One Sprint</text>
<text x="500" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">"Audit + Settings" is not one module — it's the final build-out of three separately-owned responsibilities.</text>

<!-- Organization box -->
<rect x="40" y="100" width="280" height="200" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.2"/>
<text x="180" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#6d28d9">Organization Module</text>
<text x="180" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#6d28d9">(new folder — old, unfinished module)</text>
<line x1="60" y1="165" x2="300" y2="165" stroke="#c4b5fd" stroke-width="1"/>
<text x="60" y="188" font-family="Consolas, Menlo, monospace" font-size="10" fill="#6d28d9">✔ GET /organization</text>
<text x="60" y="208" font-family="Consolas, Menlo, monospace" font-size="10" fill="#6d28d9">✔ PATCH /organization (Owner only)</text>
<text x="60" y="235" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7c3aed">Resolves: "Organization Settings"</text>
<text x="60" y="252" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7c3aed">(system-modules.md §3: "not a</text>
<text x="60" y="269" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7c3aed">Settings module — an extension</text>
<text x="60" y="286" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7c3aed">of Organization")</text>

<!-- Authentication (extended) box -->
<rect x="360" y="100" width="280" height="200" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2.2"/>
<text x="500" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#be185d">Authentication (extended)</text>
<text x="500" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#be185d">(Stage 1 module, small addition)</text>
<line x1="380" y1="165" x2="620" y2="165" stroke="#f9a8d4" stroke-width="1"/>
<text x="380" y="188" font-family="Consolas, Menlo, monospace" font-size="10" fill="#be185d">✔ GET /me (already existed, Stage 1)</text>
<text x="380" y="208" font-family="Consolas, Menlo, monospace" font-size="10" fill="#be185d">✔ PATCH /me (NEW)</text>
<text x="380" y="228" font-family="Consolas, Menlo, monospace" font-size="10" fill="#be185d">✔ POST /me/change-password (NEW)</text>
<text x="380" y="255" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#db2777">Resolves: "Profile"</text>
<text x="380" y="272" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#db2777">No Role gate — self-scoped only</text>

<!-- Audit box -->
<rect x="680" y="100" width="280" height="200" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2.2"/>
<text x="820" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#4338ca">Audit Module</text>
<text x="820" y="152" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#4338ca">(entirely new — new table too)</text>
<line x1="700" y1="165" x2="940" y2="165" stroke="#a5b4fc" stroke-width="1"/>
<text x="700" y="188" font-family="Consolas, Menlo, monospace" font-size="10" fill="#4338ca">✔ GET /audit-logs (+ /{id})</text>
<text x="700" y="208" font-family="Consolas, Menlo, monospace" font-size="10" fill="#4338ca">✔ GET /security-logs</text>
<text x="700" y="228" font-family="Consolas, Menlo, monospace" font-size="10" fill="#4338ca">   (Owner + Admin only)</text>
<text x="700" y="255" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#4f46e5">Resolves: "Audit" + "Security Logs"</text>
<text x="700" y="272" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#4f46e5">(ADR-001: the one new table)</text>

<!-- bottom note -->
<rect x="150" y="340" width="700" height="130" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="500" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Why One Sprint, Three Modules?</text>
<text x="500" y="390" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">The frozen roadmap (08-sprint-roadmap.md §9) groups all four items into Sprint 7.</text>
<text x="500" y="410" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">Two of the three modules involved (Organization, Audit) never had their own</text>
<text x="500" y="430" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">documentation folder before this Sprint — this is where that gets resolved,</text>
<text x="500" y="450" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">alongside the smallest of the three: Authentication's Profile extension.</text>

<text x="500" y="500" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#334155" font-weight="700">Sprint 7 Definition of Done: the system is ready as a complete MVP.</text>
</svg>
