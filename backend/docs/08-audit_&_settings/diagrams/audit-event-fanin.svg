<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="1050" height="620">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
  </marker>
</defs>
<rect x="0" y="0" width="1050" height="620" fill="#f8fafc"/>
<text x="525" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">SentinelX — Audit Event Fan-In</text>
<text x="525" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Every module fires events. Audit listens to all of them. Nothing depends on Audit — it is purely a recorder.</text>

<!-- Source modules row -->
<rect x="20" y="90" width="150" height="60" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.8"/>
<text x="95" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9">Organization</text>

<rect x="190" y="90" width="150" height="60" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
<text x="265" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#be185d">Authentication</text>
<text x="265" y="136" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#be185d">(Identity + API Key)</text>

<rect x="360" y="90" width="150" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="435" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#c2410c">Agent</text>

<rect x="530" y="90" width="150" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="605" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">Alert</text>

<rect x="700" y="90" width="150" height="60" rx="8" fill="#ecfdf5" stroke="#166534" stroke-width="1.8" opacity="0.5"/>
<text x="775" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Observation /</text>
<text x="775" y="134" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Analysis</text>
<text x="775" y="148" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="8.5" fill="#166534">(NOT audited — see ADR-002)</text>

<!-- events labels -->
<text x="95" y="175" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#6d28d9">OrganizationUpdated</text>
<text x="265" y="175" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="8.5" fill="#be185d">UserRegistered, UserLoggedIn,</text>
<text x="265" y="188" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="8.5" fill="#be185d">ApiKeyRotated, ...</text>
<text x="435" y="175" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#c2410c">AgentCreated,</text>
<text x="435" y="188" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#c2410c">AgentArchived (2nd listener)</text>
<text x="605" y="175" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#b91c1c">AlertAcknowledged,</text>
<text x="605" y="188" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#b91c1c">AlertResolved</text>

<!-- arrows converging into Audit -->
<path d="M 95 150 L 480 320" stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M 265 150 L 500 320" stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M 435 200 L 510 320" stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M 605 200 L 540 320" stroke="#334155" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

<!-- Audit module box -->
<rect x="380" y="330" width="260" height="90" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
<text x="510" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#4338ca">Audit</text>
<text x="510" y="386" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#4338ca">passive recorder — never intervenes</text>
<text x="510" y="402" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#4338ca">dispatchers have zero knowledge of it</text>

<!-- audit_logs table -->
<path d="M 510 420 L 510 460" stroke="#4338ca" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<rect x="410" y="460" width="200" height="50" rx="8" fill="#fdf4ff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="510" y="490" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#7e22ce">audit_logs (NEW table)</text>

<!-- boundary note -->
<rect x="150" y="540" width="750" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="525" y="565" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">If Audit's write fails, every triggering action has ALREADY succeeded and committed.</text>
<text x="525" y="583" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">Audit failure never blocks or rolls back the primary action. See 03-audit-logging.md §6.</text>
</svg>
