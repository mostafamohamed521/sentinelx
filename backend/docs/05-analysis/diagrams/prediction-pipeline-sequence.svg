<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 760" width="1150" height="760">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#166534"/>
  </marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#7e22ce"/>
  </marker>
</defs>
<rect x="0" y="0" width="1150" height="760" fill="#f8fafc"/>
<text x="575" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">SentinelX — Prediction Pipeline Sequence (Sprint 4)</text>
<text x="575" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Poller claims work synchronously; the Queue Worker does the slow, failure-prone ML call.</text>

<!-- Lifelines -->
<rect x="20" y="80" width="120" height="34" rx="6" fill="#fdf4ff" stroke="#7e22ce" stroke-width="1.4"/>
<text x="80" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7e22ce">Poller (Cmd)</text>
<line x1="80" y1="114" x2="80" y2="720" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="200" y="80" width="180" height="34" rx="6" fill="#ecfdf5" stroke="#166534" stroke-width="1.4"/>
<text x="290" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#166534">Observation Module</text>
<line x1="290" y1="114" x2="290" y2="720" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="440" y="80" width="110" height="34" rx="6" fill="#fdf4ff" stroke="#7e22ce" stroke-width="1.4"/>
<text x="495" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7e22ce">Queue</text>
<line x1="495" y1="114" x2="495" y2="720" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="600" y="80" width="150" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="675" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">Queue Worker</text>
<line x1="675" y1="114" x2="675" y2="720" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="800" y="80" width="120" height="34" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="860" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c">ML Engine</text>
<line x1="860" y1="114" x2="860" y2="720" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="980" y="80" width="150" height="34" rx="6" fill="#fdf4ff" stroke="#7e22ce" stroke-width="1.4"/>
<text x="1055" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7e22ce">predictions table</text>
<line x1="1055" y1="114" x2="1055" y2="720" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Step 1: claim -->
<path d="M 80 150 L 290 150" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="185" y="142" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#334155">1. claimNextPendingBatch(N)</text>

<path d="M 290 175 L 80 175" stroke="#166534" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>
<text x="185" y="167" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#166534">claimed rows (now PROCESSING)</text>

<!-- Step 2: dispatch -->
<path d="M 80 210 L 495 210" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="285" y="202" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#334155">2. dispatch AnalyzeObservationJob(id) per claimed row</text>

<path d="M 495 245 L 675 245" stroke="#7e22ce" stroke-width="1.4" fill="none" marker-end="url(#arrowPurple)"/>
<text x="585" y="237" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#7e22ce">3. consume</text>

<!-- Step 4: fetch observation -->
<path d="M 675 280 L 290 280" stroke="#1d4ed8" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="272" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1d4ed8">4. ObservationLookupContract::findByIdForOrganization()</text>

<path d="M 290 303 L 675 303" stroke="#166534" stroke-width="1.4" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>
<text x="480" y="295" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#166534">Observation { raw_ases_json, ... }</text>

<!-- Step 5: call ML -->
<path d="M 675 340 L 860 340" stroke="#1d4ed8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="765" y="332" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1d4ed8">5. POST /analyze { observation, analysis_options }</text>

<path d="M 860 375 L 675 375" stroke="#c2410c" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="765" y="367" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#c2410c">{ verdict, risk_score, confidence, summary, evidence... }</text>

<!-- Step 6: store prediction -->
<path d="M 675 410 L 1055 410" stroke="#166534" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<text x="870" y="402" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#166534">6. INSERT INTO predictions (verdict, confidence, ... prediction_json)</text>

<!-- Step 7: mark completed -->
<path d="M 675 445 L 290 445" stroke="#166534" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="437" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#166534">7. ObservationRepository::markCompleted(id, now())</text>

<!-- Failure branch -->
<line x1="40" y1="480" x2="1110" y2="480" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,3"/>
<text x="575" y="474" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#94a3b8">Alternative: ML call fails after 3 retries (ADR-003)</text>

<path d="M 675 505 L 290 505" stroke="#b91c1c" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="497" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#b91c1c">ObservationRepository::markFailed(id, now()) — no Prediction row written</text>

<!-- boundary note -->
<rect x="180" y="560" width="800" height="130" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="580" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Module Boundary Note</text>
<text x="580" y="608" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">Observation never initiates any of this — it only answers when called (steps 1, 4, 7).</text>
<text x="580" y="627" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">Analysis never calls Alert here — Prediction storage is where this module's job ends.</text>
<text x="580" y="646" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">Alert (Stage 5) will read this data later via PredictionLookupContract.</text>
<text x="580" y="665" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">See 05-cross-module-boundaries.md.</text>
</svg>
