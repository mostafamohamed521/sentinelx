<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#166534"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
  </marker>
</defs>
<rect x="0" y="0" width="1000" height="460" fill="#f8fafc"/>
<text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">SentinelX — AnalyzeObservationJob Retry Behavior (ADR-003)</text>
<text x="500" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Engineering default — not a frozen business rule. Adjust freely.</text>

<!-- PROCESSING -->
<rect x="60" y="110" width="180" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="150" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">PROCESSING</text>
<text x="150" y="164" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#1d4ed8">attempt 1</text>

<!-- Attempt 1 fails -->
<path d="M 240 150 L 340 150" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
<text x="290" y="142" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#b91c1c">fails</text>

<rect x="340" y="110" width="150" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="415" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#92400e">wait 10s</text>
<text x="415" y="158" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#92400e">backoff #1</text>

<path d="M 490 150 L 590 150" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="540" y="142" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#334155">retry</text>

<rect x="590" y="110" width="150" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="665" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">PROCESSING</text>
<text x="665" y="158" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1d4ed8">attempt 2</text>

<path d="M 740 150 L 840 150" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
<text x="790" y="142" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#b91c1c">fails</text>

<rect x="840" y="110" width="120" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="900" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#92400e">wait 60s</text>
<text x="900" y="158" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#92400e">backoff #2</text>

<!-- row 2 -->
<path d="M 900 190 C 900 230 900 230 665 230" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="800" y="222" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#334155">retry</text>

<rect x="565" y="230" width="150" height="80" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="640" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">PROCESSING</text>
<text x="640" y="278" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1d4ed8">attempt 3</text>

<path d="M 565 270 L 430 270" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
<text x="500" y="262" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#b91c1c">fails</text>

<rect x="270" y="230" width="160" height="80" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="350" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">FAILED</text>
<text x="350" y="282" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#b91c1c">terminal — no auto retry</text>

<!-- success branches -->
<rect x="60" y="340" width="900" height="70" rx="10" fill="#ecfdf5" stroke="#166534" stroke-width="1.6"/>
<text x="510" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#166534">Success at any attempt</text>
<text x="510" y="386" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#166534">Prediction stored → markCompleted() → COMPLETED (terminal, success)</text>

<!-- legend -->
<text x="500" y="435" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b">Backoff schedule: 10s → 60s → 300s (3 total attempts). See ADR-003 for full reasoning — numbers are an engineering default.</text>
</svg>
