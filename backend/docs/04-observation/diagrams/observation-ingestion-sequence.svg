<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#166534"/>
  </marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#b91c1c"/>
  </marker>
</defs>
<rect x="0" y="0" width="1100" height="700" fill="#f8fafc"/>
<text x="550" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">SentinelX — Observation Ingestion Sequence (Sprint 3)</text>
<text x="550" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Receive → Authenticate → Validate → Persist. Pipeline ends here — no ML call exists in Stage 3.</text>

<!-- Lifelines -->
<rect x="30" y="80" width="130" height="34" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
<text x="95" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">SDK (Agent)</text>
<line x1="95" y1="114" x2="95" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="220" y="80" width="180" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="310" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Auth (API Key submodule)</text>
<line x1="310" y1="114" x2="310" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="470" y="80" width="200" height="34" rx="6" fill="#ecfdf5" stroke="#166534" stroke-width="1.4"/>
<text x="570" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">Observation Module</text>
<line x1="570" y1="114" x2="570" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="740" y="80" width="150" height="34" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
<text x="815" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#c2410c">Agent Module</text>
<line x1="815" y1="114" x2="815" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<rect x="960" y="80" width="110" height="34" rx="6" fill="#fdf4ff" stroke="#7e22ce" stroke-width="1.4"/>
<text x="1015" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#7e22ce">Database</text>
<line x1="1015" y1="114" x2="1015" y2="660" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Step 1 -->
<path d="M 95 150 L 310 150" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="200" y="142" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#334155">1. POST /observations (X-API-Key, ASES body)</text>

<path d="M 310 175 L 1015 175" stroke="#1d4ed8" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<text x="660" y="167" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#1d4ed8">SELECT api_keys WHERE key_hash=? AND status=ACTIVE</text>

<path d="M 1015 198 L 310 198" stroke="#166534" stroke-width="1.3" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>

<path d="M 310 222 L 570 222" stroke="#166534" stroke-width="1.6" fill="none" marker-end="url(#arrowGreen)"/>
<text x="440" y="214" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#166534">AuthenticatedIdentity{ agentId, organizationId }</text>

<!-- Step 2: validate -->
<rect x="500" y="240" width="140" height="30" rx="6" fill="#ffffff" stroke="#166534" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="570" y="260" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#166534">ObservationValidator</text>

<!-- Step 3: persist -->
<path d="M 570 285 L 1015 285" stroke="#166534" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<text x="790" y="277" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#166534">INSERT INTO observations (analysis_status=PENDING)</text>

<path d="M 1015 308 L 570 308" stroke="#166534" stroke-width="1.3" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="3,2"/>

<!-- Step 4: touchLastSeen -->
<path d="M 570 335 L 815 335" stroke="#c2410c" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<text x="690" y="327" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#c2410c">AgentRepository::touchLastSeen(agentId, receivedAt)</text>

<path d="M 815 358 L 1015 358" stroke="#c2410c" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<text x="915" y="350" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#c2410c">UPDATE agents SET last_seen_at=?</text>

<!-- Step 5: response -->
<path d="M 570 400 L 95 400" stroke="#166534" stroke-width="1.7" fill="none" marker-end="url(#arrowGreen)"/>
<text x="330" y="392" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#166534">202 Accepted — { id, received_at, analysis_status: PENDING }</text>

<!-- Failure branch -->
<line x1="60" y1="440" x2="1040" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,3"/>
<text x="550" y="434" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#94a3b8">Alternative: validation fails</text>

<path d="M 570 470 L 95 470" stroke="#b91c1c" stroke-width="1.6" fill="none" marker-end="url(#arrowRed)"/>
<text x="330" y="462" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#b91c1c">422 VALIDATION_ERROR — nothing written to DB</text>

<!-- boundary note -->
<rect x="150" y="520" width="800" height="110" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="550" y="545" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Module Boundary Note</text>
<text x="550" y="566" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">Pipeline ends here. No Queue, no ML Client, no Analysis call exists in this sequence —</text>
<text x="550" y="584" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">deliberately. Stage 4 (Analysis) later polls PENDING rows itself; Observation never pushes to it.</text>
<text x="550" y="602" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">See 05-cross-module-boundaries.md and 07-implementation-order.md.</text>
</svg>
