<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#334155"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#166534"/>
  </marker>
</defs>
<rect x="0" y="0" width="1000" height="460" fill="#f8fafc"/>
<text x="500" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">SentinelX — Alert Status State Machine</text>
<text x="500" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">OPEN → ACKNOWLEDGED → RESOLVED. RESOLVED is terminal in V1 (ADR-002).</text>

<!-- created entry -->
<circle cx="150" cy="100" r="6" fill="#0f172a"/>
<path d="M 150 106 L 150 140" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="230" y="128" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155">verdict != SAFE</text>

<!-- OPEN -->
<rect x="60" y="140" width="180" height="80" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="150" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#b91c1c">OPEN</text>
<text x="150" y="195" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#b91c1c">default, on creation</text>

<!-- ACKNOWLEDGED -->
<rect x="400" y="140" width="200" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.2"/>
<text x="500" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#92400e">ACKNOWLEDGED</text>
<text x="500" y="195" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#92400e">acknowledged_at / by set</text>

<!-- RESOLVED -->
<rect x="760" y="140" width="180" height="80" rx="10" fill="#ecfdf5" stroke="#166534" stroke-width="2.2"/>
<text x="850" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#166534">RESOLVED</text>
<text x="850" y="195" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#166534">terminal (ADR-002)</text>

<!-- OPEN -> ACKNOWLEDGED -->
<path d="M 240 180 L 400 180" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="320" y="172" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#334155">PATCH .../acknowledge</text>

<!-- ACKNOWLEDGED -> RESOLVED -->
<path d="M 600 180 L 760 180" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="680" y="172" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#334155">PATCH .../resolve</text>

<!-- OPEN -> RESOLVED direct (skip-ahead) -->
<path d="M 150 220 C 150 300 850 300 850 220" stroke="#1d4ed8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="315" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#1d4ed8">PATCH .../resolve — skip-ahead allowed (03-generation-pipeline.md §4)</text>

<!-- idempotency self-loops -->
<path d="M 400 160 C 350 100 450 100 400 160" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
<text x="500" y="105" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#64748b">re-acknowledge / re-resolve → 409 CONFLICT</text>

<!-- no reopen note -->
<rect x="150" y="360" width="700" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="500" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">No Reverse Transition in V1</text>
<text x="500" y="405" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">module-responsibilities.md mentions "Reopen" — ALERTS_API.md exposes no such route.</text>
<text x="500" y="423" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e">See ADR-002 for the full resolution.</text>
</svg>
